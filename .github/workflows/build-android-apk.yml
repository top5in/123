name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install --global pnpm@9.12.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Remove optional development-only imports
        run: |
          rm -f 'app/dev/theme-lab.tsx'
          rm -f 'app/oauth/callback.tsx'
          mkdir -p 'components'
          cat > 'components/screen-container.tsx' <<'EOF'
          import { View, type ViewProps } from "react-native";
          import { SafeAreaView, type Edge } from "react-native-safe-area-context";

          export interface ScreenContainerProps extends ViewProps {
            edges?: Edge[];
            className?: string;
            containerClassName?: string;
            safeAreaClassName?: string;
          }

          export function ScreenContainer({
            children,
            edges = ["top", "left", "right"],
            className,
            containerClassName,
            safeAreaClassName,
            style,
            ...props
          }: ScreenContainerProps) {
            return (
              <View className={`flex-1 bg-background ${containerClassName ?? ""}`} {...props}>
                <SafeAreaView edges={edges} className={`flex-1 ${safeAreaClassName ?? ""}`} style={style}>
                  <View className={`flex-1 ${className ?? ""}`}>{children}</View>
                </SafeAreaView>
              </View>
            );
          }
          EOF
          test -f 'components/screen-container.tsx'
          echo 'screen-container.tsx created successfully'
          mkdir -p 'hooks'
          cat > 'hooks/use-colors.ts' <<'EOF'
          export function useColors() {
            return {
              background: "#111111",
              border: "#27272A",
              foreground: "#F4F4F5",
              muted: "#A1A1AA",
              surface: "#18181B",
            };
          }
          EOF
          sed -i '/@\/components\/screen-container/d' 'app/(tabs)/index.tsx'
          sed -i 's#<ScreenContainer containerClassName="bg-background" className="px-5">#<View className="flex-1 bg-background px-5">#' 'app/(tabs)/index.tsx'
          sed -i 's#</ScreenContainer>#</View>#' 'app/(tabs)/index.tsx'
          cat > 'app/_layout.tsx' <<'EOF'
          import { Stack } from "expo-router";
          import { StatusBar } from "expo-status-bar";
          import { GestureHandlerRootView } from "react-native-gesture-handler";
          import { SafeAreaProvider, initialWindowMetrics } from "react-native-safe-area-context";

          export const unstable_settings = { anchor: "(tabs)" };

          export default function RootLayout() {
            return (
              <GestureHandlerRootView style={{ flex: 1 }}>
                <SafeAreaProvider initialMetrics={initialWindowMetrics}>
                  <Stack screenOptions={{ headerShown: false }}>
                    <Stack.Screen name="(tabs)" />
                  </Stack>
                  <StatusBar style="auto" />
                </SafeAreaProvider>
              </GestureHandlerRootView>
            );
          }
          EOF

      - name: Generate Android project
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monthly-planner-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
