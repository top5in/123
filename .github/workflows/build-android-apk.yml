name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo-doctor
        continue-on-error: true

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

        
      - name: Build release APK
        working-directory: android
        run: |
          unset GRADLE_OPTS unset JAVA_OPTS cd android chmod +x gradlew ./gradlew :app:assembleRelease --no-daemon --stacktrace find app/build/outputs -type f -name "*.apk" -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monthly-planner-release-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
      
      - name: List build outputs
        if: always()
        run: |
          echo "All APK files:"
          find . -type f -name "*.apk" -print || true
          echo "Android outputs:"
          find android/app/build -maxdepth 6 -type f 2>/dev/null | head -100 || true


